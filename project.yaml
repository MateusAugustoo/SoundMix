name: soundMix-app
options:
  deploymentTarget:
    macOS: "14.2"

targets:
  soundMix-app:
    type: application
    platform: macOS
    sources:
      - path: SoundMix
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: Sound Mix
        PRODUCT_BUNDLE_IDENTIFIER: com.soundmix.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: SoundMix/SoundMix-Bridging-Header.h
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic

schemes:
  soundMix-app:
    build:
      targets:
        soundMix-app: all
    run:
      config: Debug
    archive:
      config: Release
